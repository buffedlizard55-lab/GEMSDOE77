name: Publish research site and source feed
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh source inventory only — never model or slot selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh_sources.py
      - run: python scripts/build_site.py
      - run: python scripts/lia_build_site.py
      - name: Independently re-read every listed primary TIFF (no model or slot)
        run: python scripts/audit_downloads.py
      - run: python scripts/build_home.py
      - run: python scripts/release_gate.py --verify-fail-closed
      - run: python -m pytest -q
      - run: python scripts/stage_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
